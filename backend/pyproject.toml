[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary,pool]>=3.2,<4", "pgvector>=0.4,<1",
  "alembic>=1.15,<2", "sentence-transformers>=5,<6", "torch>=2.6,<3",
  "langchain-google-genai>=4,<5", "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "mcp>=1.20,<2", "httpx>=0.28,<1", "tree-sitter>=0.25,<0.26", "tree-sitter-java>=0.23,<0.24"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires the configured dedicated PostgreSQL database", "live: uses Gemini quota"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
